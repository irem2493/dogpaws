<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <th:block th:replace="/layout-parts/config-admin :: configFragment"></th:block>
    <style>
        .body-container.hide-sidebar aside {
            display: none;
        }
        .body-container.hide-sidebar .content {
            margin-left: 0;
            width: 100%;
        }
        .body-container{
            min-height: 100vh;
        }
        .sidebar{
            min-height: 100%;
            background-color: white;
        }
         hr {
             border: none;
             border-top: 1px solid #A2854A;
             margin: 10px 0;
         }
        .sidebar-menu li {

            margin-bottom: 5px;
        }

        .sidebar-menu li a {

            color: var(--black);
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 10px 10px;
            border-radius: 20px;
        }

        .sidebar-menu ul {
            list-style: none;
            padding-left: 30px;
        }
        .sidebar-section{
            margin-bottom: 50px;
        }

        .admin-logo{
            width: 160px;
            height: auto;
            margin-bottom: 20px;
        }
        .container{
            margin-left: 40px;
            width: 100%;
            min-height: 100vh;
            padding-top: 60px;
        }
        .pw-title {
            width: 100%;
            height: 70px;
            border-bottom: 5px solid #D9D9D9;
            text-align: left;
            font-size: 1.6rem;
            line-height: normal;
            margin-top: 40px;
            font-weight: 500;
            display: flex;
            justify-content: start;
            align-items: center;
        }
    </style>
    <title>관리자페이지</title>
</head>

<body>
    <div class="body-container" th:classappend="${hideSidebar} ? 'hide-sidebar' ">
        <!-- 사이드바 영역 -->
        <aside th:replace="/layout-parts/sidebar-admin :: sidebar"></aside>
        <!-- 컨텐츠 영역 -->
        <div layout:fragment="content"></div>
    </div>
</body>
</html>
