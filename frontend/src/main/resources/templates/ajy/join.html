<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <link rel="stylesheet" href="/css/ajy/join.css" />

    <title>회원가입</title>
</head>
<body layout:fragment="content" style="min-height: 100vh">
<div class="container">
<div class="join-container">
    <div class="container_box">
        <div class="header">사용자 정보 등록</div>

        <div class="form-container">

            <div class="sidebar">

                <div class="progress-container">
                    <div class="step">
                        <div class="circle-container">
                            <div class="inner-circle completed"></div>
                        </div>
                        <div class="text">사용자 정보 등록</div>
                    </div>
                    <div class="step">
                        <div class="circle"></div>
                        <div class="text">강아지 프로필 등록(1개 필수 등록)</div>
                    </div>
                    <div class="step">
                        <div class="circle"></div>
                        <div class="text">교배 매칭 선택</div>
                    </div>
                </div>
                <div style="margin-top: 200px"></div>
                <img src="/img/dog.png" alt="강아지 이미지">
            </div>

            <div class="divider"></div>

            <div class="form-fields">
                <form id="step1Form">
                    <label for="username"><span class="required">*</span> 아이디</label>
                    <div class="input-with-button">
                        <input type="text" id="username" name="username" placeholder="아이디를 입력하세요">
                        <button type="button" onclick="idCheck()">중복 확인</button>

                    </div>
                    <label for="password"><span class="required">*</span> 패스워드</label>
                    <input type="password" id="password" name="password" placeholder="패스워드를 입력하세요">
                    <label for="confirmPassword"><span class="required">*</span> 패스워드 확인</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="패스워드를 재입력하세요">
                    <label for="nickname"><span class="required">*</span>닉네임</label>
                    <input type="text" id="nickname" name="nickname" placeholder="닉네임을 입력해주세요">

                    <div class="form-row">
                        <div class="form-group1">
                            <label for="ageGroup">연령대</label>
                            <select id="ageGroup" class="select-a" name="ageGroup">
                                <option value="" disabled selected>연령대를 선택해주세요</option>
                                <option value="20대">20대 (20 - 29)</option>
                                <option value="30대">30대 (30 - 39)</option>
                                <option value="40대">40대 (40 - 49)</option>
                                <option value="50대">50대 (50 - 59)</option>
                                <option value="60대">60대 (60 - 69)</option>
                                <option value="70대">70대 (70 - 79)</option>
                                <option value="80대">80대 (80 - 89)</option>
                            </select>
                        </div>

                        <div class="form-group2">

                            <label>성별</label>
                            <div class="gender-container">

                                <!-- ✅ hidden input 추가 -->
                                <div class="gender-select">
                                    <input type="hidden" name="gender" id="gender" />

                                    <button
                                            type="button"
                                            onclick="setGender('M', this)"
                                    >
                                        남자
                                    </button>

                                    <button
                                            type="button"
                                            onclick="setGender('F', this)"
                                    >
                                        여자
                                    </button>
                              </div>
                            </div>
                        </div>
                    </div>
                    <label for="email"><span class="required">*</span> 이메일</label>
                    <input type="email" id="email" name="email" placeholder="이메일을 입력하세요">

                    <label for="address"><span class="required">*</span> 산책로 주소검색</label>
                    <div class="input-with-button">
                        <input type="text" id="postcode" name="postcode" placeholder="우편번호를 입력하세요">
                        <button type="button" id="addressBtn" onclick="execDaumPostcode()">우편번호</button>
                    </div>
                    <input type="text" id="address" name="address" placeholder="주소 입력">
                    <input type="text" id="detailAddress" name="detailAddress" placeholder="상세 주소 입력">

                    <!--<div class="social-login">
                        <div class="line-text">또는</div>
                        <img src="/img/Naver_small.png" alt="네이버 로그인">
                        <img src="/img/Kakao_small.png" alt="카카오 로그인">
                        <img src="/img/Google_small.png" alt="구글 로그인">
                    </div>-->
                </form>
                <div class="button-container">
                    <button id="nextButton" onclick="saveStep1()">다음</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="/js/ajy/join.js"></script>
</body>
</html>
