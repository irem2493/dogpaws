<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-mypage}">
<head>
    <link rel="stylesheet" href="/css/ajy/login.css" />

    <title>개인정보 관리</title>
</head>
<body layout:fragment="content" style="min-height: 100vh">
<div class="container">
    <div class="edit-container">

        <div class="login-container" style="max-width: 450px">
            <h1>개인정보 관리</h1>
            <hr>
            <p>
                <span class="info-icon">⚠️</span> 안전한 개인정보 수정을 위해 이메일을 입력해주세요
            </p>
            <form id="emailForm">
                <label class="required">* <span style="color:black">이메일</span></label>
                <input type="hidden" name="provider" id="provider" th:value="${provider}"/>
                <input type="email"
                       name="email"
                       id="email"
                       placeholder="이메일을 입력하세요"
                />
                <div id="error-message" class="genesis-error-message-custom" style="display: none;">
                    이메일을 다시 확인해주세요...
                </div>
                <button type="submit" class="btn-confirm">확인</button>
            </form>
        </div>
    </div>

</div>
<script src="/js/ajy/mypage/user_edit_email.js"></script>
</body>
</html>
