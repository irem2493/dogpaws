<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <link rel="stylesheet" href="/css/ajy/join.css" />
  <link rel="stylesheet" href="/css/ajy/dog_profile.css" />
  <title>강아지 프로필 등록</title>
</head>
<body layout:fragment="content" style="min-height: 100vh">
<div class="container">
  <div class="join-container">
    <div class="container_box">
      <div class="header">강아지 프로필 등록</div>
      <div class="form-container" style="justify-content: center;'">

        <div class="form-fields">
          <form id="dogForm" enctype="multipart/form-data">
            <div class="center-profile">
              <div class="profile" id="profileUpload">
                <img id="profileImagePreview" src="" alt="프로필 이미지" class="profile-img-preview">
                <div class="profile-upload-circle">+</div>
                <input type="file" id="fileInput" name="profileImage" accept="image/*" style="display: none;">
              </div>
            </div>

            <label for="dogName"><span class="required">*</span> 강아지 이름</label>
            <input type="text" id="dogName" name="dogName" placeholder="강아지 이름를 입력하세요 ">

            <label for="breedSelect"><span class="required">*</span>품종</label>
            <div class="flex-box">
              <select class="select-a" style="width:88%; margin-right: 10px" id="breedSelect" name="breed">
                <option value="" disabled selected>품종을 선택하세요</option>
                <option th:each="breed : ${breedList}"
                        th:value="${breed['gubn_code']}"
                        th:text="${breed['gubn_name']}">
                </option>
              </select>
              <input type="checkbox" class="checkbox-basic" id="mixBreed" name="isMix" style="margin-right: 5px; " value="Y">믹스
            </div>

            <div class="form-row">
              <div class="form-group_profile">
                <label for="birthYear">생년월</label>
                <div class="flex-box">
                  <select id="birthYear" class="select-a" style="width: 200px; margin-right: 10px" name="birthYear">
                    <option value="" >연도 선택</option>
                  </select>

                  <select id="birthMonth" class="select-a" style="width: 150px" name="birthMonth">
                    <option value="" >월 선택</option>
                  </select>
                </div>
              </div>

              <div class="form-group2">

                <label><span class="required">*</span> 성별</label>
                <div class="gender-container">

                  <!-- ✅ hidden input 추가 -->
                  <div class="gender-select">
                    <input type="hidden" name="gender" id="gender" />

                    <button
                            type="button"
                            onclick="setGender('M', this)"
                    >
                      남자
                    </button>

                    <button
                            type="button"
                            onclick="setGender('F', this)"
                    >
                      여자
                    </button>
                  </div>
                </div>
              </div>
              <div class="form-group1">
                <div class="flex-box" style="margin-top: 30px">
                  <input type="checkbox" class="checkbox-basic" id="isNeutered" name="isNeutered" value="Y">중성화
                </div>
              </div>

            </div>

            <label for="dogIntro"> 강아지 소개글</label>
            <textarea id="dogIntro" placeholder="강아지 소개글을 입력하세요" rows="4" cols="50" name="dogIntro"></textarea>

            <div class="personality-container">
              <div class="label">강아지 성격(최대 5개 선택 가능)</div>
              <div class="search-box">
                <input type="text" id="searchInput" placeholder="성격을 입력해 주세요" onfocus="showDropdown()">
                <span onclick="clearInput()"><img src="/img/icon/search.svg" alt="search-icon"></span>
              </div>
              <div class="dropdown" id="dropdown" style="display: none;">
                <div th:if="${personalityList != null}" th:each="personality : ${personalityList}" class="option">
                  <input type="checkbox" class="checkbox-basic"
                         th:id="'option' + ${personality['gubn_code']}"
                         th:value="${personality['gubn_code']}"
                         th:attr="data-name=${personality['gubn_name']}"
                         onclick="selectOption(this)">
                  <label th:for="'option' + ${personality['gubn_code']}" th:text="${personality['gubn_name']}"></label>
                </div>
              </div>
              <div class="selected-options" id="selectedOptions"></div>
            </div>

            <div class="play-container personality-container">
              <div class="label">강아지 좋아하는 놀이(최대 5개 선택 가능)</div>
              <div class="search-box">
                <input type="text" id="searchInput2" placeholder="놀이를 입력해 주세요" onfocus="showDropdown2()">
                <span onclick="clearInput2()"><img src="/img/icon/search.svg" alt="search-icon"></span>
              </div>
              <div class="dropdown" id="dropdown2" style="display: none;">
                <div th:if="${playList != null}" th:each="play : ${playList}" class="option">
                  <input type="checkbox" class="checkbox-basic"
                         th:id="'option' + ${play['gubn_code']}"
                         th:value="${play['gubn_code']}"
                         th:attr="data-name=${play['gubn_name']}"
                         onclick="selectOption2(this)">
                  <label th:for="'option' + ${play['gubn_code']}" th:text="${play['gubn_name']}"></label>
                </div>
              </div>
              <div class="selected-options" id="selectedOptions2"></div>
            </div>

            <div class="form-group">
              <label class="label">산책 요일</label>
              <div class="checkbox-group">
                <input type="checkbox" class="checkbox-basic" id="all-days">
                <label for="all-days">전체</label>

                <input type="checkbox" class="checkbox-basic" id="월">
                <label class="active" for="월">월요일</label>

                <input type="checkbox" class="checkbox-basic" id="화">
                <label class="active" for="화">화요일</label>

                <input type="checkbox" class="checkbox-basic" id="수">
                <label class="active" for="수">수요일</label>

                <input type="checkbox" class="checkbox-basic" id="목">
                <label for="목">목요일</label>

                <input type="checkbox" class="checkbox-basic" id="금">
                <label for="금">금요일</label>

                <input type="checkbox" class="checkbox-basic" id="토">
                <label for="토">토요일</label>

                <input type="checkbox" class="checkbox-basic" id="일">
                <label for="일">일요일</label>
              </div>
            </div>

            <div class="form-group">
              <label class="label">산책 시작 시간</label><br>
              <input  class="input-a" type="time" placeholder="산책 시작 시간" id="walkStartTime" name="walkStartTime" style="width:40%">
              <input  class="input-a" type="time" placeholder="산책 종료 시간" id="walkEndTime" name="walkEndTime" style="width:40%">

              <input type="checkbox" class="checkbox-basic" id="walkTimeYn" name="walkTimeYn" value="Y">
              <label for="walkTimeYn">상관없음</label>
            </div>

            <div class="form-group">
              <label class="label">체중</label>
              <div class="weight-input">
                <input type="text" id="weight" name="weight" placeholder="체중을 입력하세요" style="width: 95%">
                <span>Kg</span>
              </div>
            </div>
          </form>
          <div class="button-container">
            <button type="button" id="nextButton" onclick="saveStep1Dog()" style="width: 100%">강아지 등록</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/ajy/dog_profile_step1.js"></script>

</body>
</html>
