<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-mypage}">

<div layout:fragment="content">
    <div class="container mt-5">
        <h2 class="mb-4">주문 상세보기</h2>
        <p class="text-muted" th:text="${#temporals.format(order.orderDate, 'yyyy.MM.dd')} + ' 결제'"></p>

        <!-- 배송 정보 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row mb-2">
                    <div class="col-3">받는사람</div>
                    <div class="col-9" th:text="${order.receiverName}"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-3">휴대전화</div>
                    <div class="col-9" th:text="${order.receiverPhone}"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-3">배송 주소</div>
                    <div class="col-9">
                        <span th:text="${order.shippingZipcode}"></span><br>
                        <span th:text="${order.shippingAddress1}"></span>
                        <span th:text="${order.shippingAddress2}"></span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-3">배송요청사항</div>
                    <div class="col-9" th:text="${order.shippingMemo ?: '없음'}"></div>
                </div>
            </div>
        </div>

        <!-- 결제 정보 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row mb-2">
                    <div class="col-3">총 상품금액</div>
                    <div class="col-9" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-3">배송비</div>
                    <div class="col-9" th:text="${#numbers.formatDecimal(order.deliveryFee, 0, 'COMMA', 0, 'POINT')} + '원'"></div>
                </div>
                <div class="row">
                    <div class="col-3">총 결제금액</div>
                    <div class="col-9" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></div>
                </div>
            </div>
        </div>

        <!-- 주문 상품 목록 -->
        <div class="card">
            <div class="card-body">
                <div class="row" th:each="item : ${order.orderItems}">
                    <div class="col-2">
                        <img th:src="${item.imageUrl}" class="img-fluid" alt="상품 이미지">
                    </div>
                    <div class="col-10">
                        <p class="text-muted mb-1" th:text="${item.manufacturer}"></p>
                        <h5 th:text="${item.productName}"></h5>
                        <!-- 옵션 정보와 수량 -->
                        <div th:if="${item.options != null and !item.options.empty}">
                            <p class="mb-2" th:each="option : ${item.options}">
                                <span th:text="${option.optionName}"></span>
                                <span th:text="'(' + ${#numbers.formatDecimal(item.productPrice -  option.optionPrice, 0, 'COMMA', 0, 'POINT')} + '원)'"></span>
                                <span th:text="' ' + ${option.quantity} + '개'"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- 주문 금액 정보 -->
                <div class="mt-3 text-end">
                    <p class="mb-1">
                        <span>상품 금액: </span>
                        <span th:text="${#numbers.formatDecimal(order.totalPrice - order.deliveryFee, 0, 'COMMA', 0, 'POINT')} + '원'"></span>
                    </p>
                    <p class="mb-1">
                        <span>배송비: </span>
                        <span th:text="${#numbers.formatDecimal(order.deliveryFee, 0, 'COMMA', 0, 'POINT')} + '원'"></span>
                    </p>
                    <p class="mb-0 fw-bold">
                        <span>총 결제금액: </span>
                        <span th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
