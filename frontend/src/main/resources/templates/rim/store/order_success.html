<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-mypage}">
<head>

    <script src="https://js.tosspayments.com/v2/standard"></script>

    <title>결제 완료</title>
    <meta charset="utf-8" />
</head>
<body layout:fragment="content" style="min-height: 100vh">


<div class="container">
    <div class="order-success-container mt-5">
        <div class="text-center mb-4">
            <h2>주문이 완료되었습니다</h2>
            <p>주문번호: <span th:text="${order.qlId}"></span></p>
        </div>

        <!-- 주문 상품 정보 -->
        <div class="card mb-4">
            <div class="card-header">주문 상품</div>
            <div class="card-body">
                <div th:each="item : ${order.orderItems}" class="mb-3 border-bottom pb-3">
                    <div class="row align-items-center">
                        <div class="col-md-2">
                            <img th:src="${item.imageUrl}" class="img-fluid" alt="상품 이미지">
                        </div>
                        <div class="col-md-10">
                            <h5 th:text="${item.productName}" class="mb-2">상품명</h5>
                            <div th:each="option : ${item.options}" class="mb-2">
                                <p class="mb-1">
                                    <span th:text="${option.optionName}">옵션명</span>
                                    <span th:text="${option.quantity}">수량</span>개
                                    <span th:text="${#numbers.formatInteger(option.optionPrice, 0, 'COMMA')}">0</span>원
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 주문자 정보 -->
        <div class="card mb-4">
            <div class="card-header">주문자 정보</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p>주문일시: <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                        <p>주문자: <span th:text="${order.orderName}"></span></p>
                        <p>연락처: <span th:text="${order.orderPhone}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 배송 정보 -->
        <div class="card mb-4">
            <div class="card-header">배송 정보</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p>수령인: <span th:text="${order.receiverName}"></span></p>
                        <p>수령인 연락처: <span th:text="${order.receiverPhone}"></span></p>
                        <p>배송지: <span th:text="${order.shippingZipcode}"></span></p>
                        <p><span th:text="${order.shippingAddress1 + ' ' + order.shippingAddress2}"></span></p>
                        <p>배송 요청사항: <span th:text="${order.shippingMemo}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 결제 정보 -->
        <div class="card mb-4">
            <div class="card-header">결제 정보</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <table class="table table-borderless">
                            <tr>
                                <td>상품 금액</td>
                                <td class="text-end">
                                    <span th:text="${#numbers.formatInteger(order.totalPrice - order.deliveryFee, 0, 'COMMA')}">0</span>원
                                </td>
                            </tr>
                            <tr>
                                <td>배송비</td>
                                <td class="text-end">
                                    <span th:text="${#numbers.formatInteger(order.deliveryFee, 0, 'COMMA')}">0</span>원
                                </td>
                            </tr>
                            <tr class="border-top">
                                <td><strong>총 결제금액</strong></td>
                                <td class="text-end">
                                    <strong><span th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')}">0</span>원</strong>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mb-5">
            <a href="/orders/list" class="btn btn-primary">주문 목록 보기</a>
            <a href="/" class="btn btn-secondary">쇼핑 계속하기</a>
        </div>
    </div>
</div>


</div>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="/js/rim/order_create.js"></script>
</body>
</html>
