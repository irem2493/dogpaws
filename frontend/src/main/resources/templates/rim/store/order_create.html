<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-mypage}">
<head>
    <title>주문/결제</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/css/rim/store/store.css">
    <link rel="stylesheet" href="/css/rim/store/cart_list.css">
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body layout:fragment="content" style="min-height: 100vh; ">


<div class="container" style="justify-content: left; padding-top: 28px;     margin: 0px 141px 80px 75px;" >

    <div class="pw-title" style="width: 100%; justify-content: left; border-color: #DDBC98">
        <div style="height: 70px; width: 150px; border-bottom: 8px; justify-content: left; line-height: 65px">
            주문/결제
        </div>

    </div>

    <!-- 네비게이션 경로 -->
    <div class="nav-path">
        01 장바구니 > <strong style="color: #EF7E06;">02 주문결제</strong> > 03 결제완료
    </div>

    <!-- 주문자 정보 섹션 -->
    <div class="cart-list-box">
        <div class="top-actions">
            <p style="font-size: 1.3rem; margin: 0">주문자 정보</p>
        </div>
        <div class="card-body">
            <div class="order-section">
                <table class="info-table">
                    <colgroup>
                        <col width="150px">
                        <col width="auto">
                    </colgroup>
                    <tbody>
                    <tr>
                        <th>주문자명</th>
                        <td>
                            <input type="text" class="input-a" id="orderName" name="orderName">
                        </td>
                    </tr>
                    <tr>
                        <th>연락처</th>
                        <td>
                            <input type="tel" class="input-a" id="orderPhone" name="orderPhone">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 배송 정보 섹션 -->
    <div class="cart-list-box">
        <div class="top-actions">
            <p style="font-size: 1.3rem; margin: 0">배송 정보</p>
        </div>
        <div class="card-body">

            <div class="shipping-buttons">
                <button type="button" class="btn btn-sm btn-orange-dark" onclick="openModal('shippingModal')">
                    배송정보 입력
                </button>
            </div>
            <div class="shipping-section">
                <table class="info-table">
                    <colgroup>
                        <col width="150px">
                        <col width="auto">
                    </colgroup>
                    <tbody>
                    <tr>
                        <th>받는 사람</th>
                        <td id="displayReceiverName">배송지 정보를 설정하세요</td>
                    </tr>
                    <tr>
                        <th>연락처</th>
                        <td id="displayReceiverPhone">배송지 정보를 설정하세요</td>
                    </tr>
                    <tr>
                        <th>주소</th>
                        <td id="displayFullAddress">배송지 정보를 설정하세요</td>
                    </tr>
                    <tr style="border-top: 1px solid #DDBC98;">
                        <th>배송 메모</th>
                        <td>
                            <select class="select-a" id="shippingMemo" name="shippingMemo">
                                <option value="">배송 메모를 선택해주세요</option>
                                <option value="문 앞에 놓아주세요">문 앞에 놓아주세요</option>
                                <option value="경비실에 맡겨주세요">경비실에 맡겨주세요</option>
                                <option value="배송 전 연락 부탁드립니다">배송 전 연락 부탁드립니다</option>
                                <option value="">직접 입력</option>
                            </select>
                            <input type="text" class="input-a mt-2" id="directShippingMemo"
                                   style="display: none;" placeholder="배송메모를 입력해주세요">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>


    <!-- 배송정보 입력 모달 -->
    <div id="shippingModal" class="pawsModal" style="display: none;">
        <button type="button" class="pawsModal-close" onclick="closeModal(this)">&times;</button>
        <h3 class="pawsModal-title">배송 정보 입력</h3>
        <div class="pawsModal-content">
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="sameAsOrderer">
                <label class="form-check-label" for="sameAsOrderer">
                    주문자 정보와 동일
                </label>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="receiverName" class="form-label">받는 사람</label>
                    <input type="text" class="form-control" id="receiverName"
                           placeholder="받으시는 분의 성함을 입력하세요">
                </div>

                <div class="mb-3">
                    <label for="receiverPhone" class="form-label">휴대전화</label>
                    <input type="tel" class="form-control" id="receiverPhone"
                           placeholder="휴대전화 번호를 입력하세요">
                </div>

                <div class="mb-3">
                    <label class="form-label">배송지 주소</label>
                    <div class="input-group mb-2">
                        <input type="text" class="form-control" id="shippingZipcode"
                               placeholder="우편번호" readonly>
                        <button type="button" class="btn btn-secondary" onclick="searchAddress()">
                            배송지 검색
                        </button>
                    </div>
                    <input type="text" class="form-control mb-2" id="shippingAddress1"
                           placeholder="배송지 주소" readonly>
                    <input type="text" class="form-control" id="shippingAddress2"
                           placeholder="상세 주소">
                </div>
            </div>
        </div>
        <div class="pawsModal-footer">
            <div class="text-center mt-4">
                <button type="button" class="btn btn-orange-dark" onclick="saveShippingInfo()">
                    저장하기
                </button>
            </div>
        </div>
    </div>

    <div class="cart-list-box">
        <div class="top-actions">
            <p style="font-size: 1.3rem; margin: 0">주문 상품</p>
        </div>
        <div class="ship-cost-box" style="width: 100%; height: 40px; background-color: #FDF7F1; display: flex; justify-content: center; align-items: center;">
            <p style="width: fit-content; height: fit-content; margin: 0 auto">배송비 3,000원</p>
        </div>
        <div th:each="item : ${selectedItems.cartItems}" class="border-bottom" style="border-bottom : none; padding: 30px 30px; align-items: center; justify-content: center;">
            <div class="row" >
                <!-- 상품 이미지 -->
                <div class="col-md-2">
                    <img th:src="${item.imageUrl}" class="img-fluid" style="border-radius: 20px;" alt="상품 이미지">
                </div>
                <!-- 상품 정보 -->
                <div class="col-md-10">
                    <div class="d-flex flex-column">
                        <small class="text-muted mb-1" th:text="${item.manufacturer}">제조사명</small>
                        <h5 class="card-title mb-2" th:text="${item.productName}">상품명</h5>
                        <span class="card-title mb-2 price-display">
            <span class="price-text" th:text="${#numbers.formatInteger(item.productPrice, 0, 'COMMA')}"></span>원
        </span>

                        <!-- 옵션 목록 -->
                        <div th:each="option : ${item.cartOptions}" class="mb-2">
                            <div class="d-flex align-items-center justify-content-between">
                                <div class="d-flex align-items-center">
                                    <span th:text="${option.optionName}">옵션명</span>
                                    <span th:if="${option.optionPrice > 0}" class="ms-2">
                        (+<span th:text="${#numbers.formatInteger(option.optionPrice - item.productPrice, 0, 'COMMA')}">0</span>원)
                    </span>
                                    <span class="ms-2">수량: <span th:text="${option.quantity}">0</span>개</span>
                                </div>
                                <div class="text-end">
                                    <span th:text="${#numbers.formatInteger((option.optionPrice) * option.quantity, 0, 'COMMA')}">0</span>원
                                </div>
                            </div>
                        </div>

                        <!-- 상품별 합계 -->
                        <div class="mt-3 text-end">
                            <strong>상품 합계: <span th:text="${#numbers.formatInteger(item.getTotalPrice(), 0, 'COMMA')}">0</span>원</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="cart-list-box">
        <div class="top-actions">
            <p style="font-size: 1.3rem; margin: 0">결제 금액</p>
        </div>
        <div class="card-body">
            <div class="order-section">
                <!-- 전체 주문 금액 정보 -->
                <div class="payment-summary">
                    <div class="summary-row">
                        <span class="summary-label">총 상품금액</span>
                        <span class="summary-value">
                            <span th:text="${#numbers.formatInteger(selectedItems.totalProductPrice, 0, 'COMMA')}">0</span>원
                        </span>
                    </div>
                    <div class="summary-divider"></div>

                    <div class="summary-row">
                        <span class="summary-label">배송비</span>
                        <span class="summary-value">
                            <span th:text="${#numbers.formatInteger(selectedItems.deliveryFee, 0, 'COMMA')}">0</span>원
                        </span>
                    </div>
                    <div class="summary-divider"></div>

                    <div class="summary-row total">
                        <span class="summary-label">총 결제금액</span>
                        <span class="summary-value">
                            <strong>
                                <span th:text="${#numbers.formatInteger(selectedItems.totalOrderPrice, 0, 'COMMA')}">0</span>원
                            </strong>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- hidden 주문 정보 입력 폼 -->
    <form id="orderForm" onsubmit="return false;">
        <input type="hidden" name="username" th:value="${user.username}">
        <input type="hidden" name="totalPrice" th:value="${selectedItems.totalOrderPrice}">
        <div class="text-center">
            <button class="btn-orange-dark" id="orderSubmitBtn" style="width: 400px;">결제하기</button>
        </div>
    </form>
</div>

<!-- 결제 모달 -->
<div id="paymentModal" class="pawsModal" style="display: none;">
    <div class="modal-content">
        <button type="button" class="pawsModal-close" onclick="closeModal(this)">&times;</button>
        <h3 class="modal-title">결제 수단 선택</h3>

        <div class="wrapper">
            <div class="box_section" style="padding: 40px 30px 50px 30px; margin-top: 30px; margin-bottom: 50px">

                <!-- 결제 UI -->
                <div id="payment-method"></div>
                <!-- 이용약관 UI -->
                <div id="agreement"></div>

                <button class="button" id="payment-button" style="margin-top: 30px">결제하기</button>
            </div>
        </div>
    </div>
</div>


</div>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    const totalAmount = [[${selectedItems.totalOrderPrice}]];

<script src="/js/rim/order_create.js"></script>
</body>
</html>
