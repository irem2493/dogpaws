<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-mypage}">
<head>
    <title>주문서 작성</title>
    <meta charset="utf-8" />
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
    <script th:inline="javascript">
        // 결제 위젯 초기화에 필요한 변수들을 전역으로 선언
        // 결제 위젯 초기화
        const paymentWidget = PaymentWidget(clientKey, PaymentWidget.ANONYMOUS);
    </script>
</head>
<body layout:fragment="content" style="min-height: 100vh">
<div class="container">
    <div class="order-create-container mt-5">
        <h2>주문서 작성</h2>

        <!-- 선택한 상품 목록 -->
        <div class="card mb-4">
            <div class="card-header">주문 상품</div>
            <div class="card-body">
                <div th:each="item : ${selectedItems.cartItems}" class="mb-3">
                    <div class="row">
                        <div class="col-md-2">
                            <img th:src="${item.imageUrl}" class="img-fluid" alt="상품 이미지">
                        </div>
                        <div class="col-md-10">
                            <h5 th:text="${item.productName}">상품명</h5>
                            <div th:each="option : ${item.cartOptions}">
                                <p>
                                    <span th:text="${option.optionName}">옵션명</span>
                                    <span th:text="${option.quantity}">수량</span>개
                                    <span th:text="${#numbers.formatInteger(option.optionPrice, 0, 'COMMA')}">0</span>원
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 주문 정보 입력 폼 -->
        <form id="orderForm" onsubmit="return false;">
            <input type="hidden" name="username" th:value="${user.username}">
            <input type="hidden" name="totalPrice" th:value="${selectedItems.totalOrderPrice}">

            <!-- 주문자 정보 -->
            <div class="card mb-4">
                <div class="card-header">주문자 정보</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="orderName" class="form-label">주문자명</label>
                        <input type="text" class="form-control" id="orderName" name="orderName" required>
                    </div>
                    <div class="mb-3">
                        <label for="orderPhone" class="form-label">연락처</label>
                        <input type="tel" class="form-control" id="orderPhone" name="orderPhone" required>
                    </div>
                </div>
            </div>

            <!-- 배송지 정보 -->
            <div class="card mb-4">
                <div class="card-header">배송지 정보</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="shippingZipcode" class="form-label">우편번호</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="shippingZipcode" name="shippingZipcode" readonly required>
                            <button type="button" class="btn btn-secondary" onclick="searchAddress()">
                                주소 검색
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="shippingAddress1" class="form-label">기본주소</label>
                        <input type="text" class="form-control" id="shippingAddress1" name="shippingAddress1" readonly required>
                    </div>
                    <div class="mb-3">
                        <label for="shippingAddress2" class="form-label">상세주소</label>
                        <input type="text" class="form-control" id="shippingAddress2" name="shippingAddress2" required>
                    </div>
                    <div class="mb-3">
                        <label for="shippingMemo" class="form-label">배송 메모</label>
                        <input type="text" class="form-control" id="shippingMemo" name="shippingMemo">
                    </div>
                </div>
            </div>
            <!-- 수령인 정보 -->
            <div class="card mb-4">
                <div class="card-header">수령인 정보</div>
                <div class="card-body">
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="sameAsOrderer">
                        <label class="form-check-label" for="sameAsOrderer">
                            주문자 정보와 동일
                        </label>
                    </div>
                    <div class="mb-3">
                        <label for="receiverName" class="form-label">수령인 이름</label>
                        <input type="text" class="form-control" id="receiverName" name="receiverName" required>
                    </div>
                    <div class="mb-3">
                        <label for="receiverPhone" class="form-label">수령인 연락처</label>
                        <input type="tel" class="form-control" id="receiverPhone" name="receiverPhone" required>
                    </div>
                </div>
            </div>

            <!-- 결제 정보 -->
            <div class="card mb-4">
                <div class="card-header">결제 정보</div>
                <div class="card-body">
                    <p>총 상품금액: <span th:text="${#numbers.formatInteger(selectedItems.totalProductPrice, 0, 'COMMA')}">0</span>원</p>
                    <p>배송비: <span th:text="${#numbers.formatInteger(selectedItems.deliveryFee, 0, 'COMMA')}">0</span>원</p>
                    <h4>최종 결제금액: <span th:text="${#numbers.formatInteger(selectedItems.totalOrderPrice, 0, 'COMMA')}">0</span>원</h4>
                </div>
            </div>

            <div class="text-center">
                <button class="btn btn-orange-dark" id="orderSubmitBtn">결제하기</button>
            </div>
        </form>
    </div>

    <!-- 결제 모달 -->
    <div id="paymentModal" class="pawsModal" style="display: none;">
        <div class="modal-content">
            <button type="button" class="modal-close" onclick="closeModal(this)">&times;</button>
            <div class="modal-title">결제 수단 선택</div>

            <!-- 결제 위젯 영역 -->
            <div id="payment-widget">
                <div id="payment-method"></div>
                <div id="payment-price"></div>
            </div>

            <div class="modal-footer">
                <button class="btn-orange-dark" id="payment-button">결제하기</button>
            </div>
        </div>
    </div>

</div>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:inline="javascript">
    // 결제 금액을 Thymeleaf에서 JavaScript 변수로 전달
    const totalAmount = [[${selectedItems.totalOrderPrice}]];
    console.log('totalAmount : ', totalAmount);
    const cartItemsData = [[${selectedItems.cartItems}]];  // 변수명 변경

    console.log('totalAmount:', totalAmount);
    console.log('cartItemsData:', cartItemsData);  // 데이터 확인용 로그

</script>
<script src="/js/rim/order_create.js"></script>
</body>
</html>
