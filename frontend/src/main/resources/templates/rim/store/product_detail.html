<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>상품 상세</title>
    <link rel="stylesheet" href="/css/rim/product_detail.css">
    <style>
        .container {
            padding: 20px;
        }

        .product-main {
            margin-bottom: 50px;
        }

        .product-detail-image {
            width: 100%;
            max-width: 500px;
        }

        .product-info {
            padding: 20px;
        }

        .manufacturer {
            color: #666;
            margin-bottom: 10px;
        }

        .product-name {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .delivery-info {
            background-color: #f8f9fa;
            padding: 10px;
            margin-bottom: 20px;
        }

        .option-select {
            margin-bottom: 20px;
        }

        .selected-option {
            background-color: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-control button {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: #fff;
        }

        .total-price {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            display: flex;
            justify-content: space-between;
        }

        #addToCart {
            width: 100%;
            padding: 15px;
            font-size: 18px;
        }

        .product-details {
            margin: 50px 0;
        }

        .product-description img {
            max-width: 100%;
            margin-bottom: 20px;
        }

        .description-text {
            line-height: 1.6;
        }
    </style>
</head>
<body layout:fragment="content">
<div class="container">
    <!-- 상단 섹션 -->
    <div class="row product-main">
        <!-- 상품 이미지 -->
        <div class="col-md-6">
            <img th:src="${product.image_url}" alt="상품 상세 이미지" class="product-detail-image">
        </div>
        <!-- 상품 정보 -->
        <div class="col-md-6 product-info">
            <div class="manufacturer" th:text="${product.manufacturer}">제조사</div>
            <input type="hidden" id="productId" th:value="${product.product_id}">
            <h2 class="product-name" th:text="${product.name}">상품명</h2>
            <div class="price" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA') + '원'}">가격</div>

            <div class="delivery-info">
                오늘 주문시 내일 출발
            </div>

            <!-- 옵션 선택 -->
            <div th:with="baseOption=${product.options.?[base_option].get(0)}">
                <input type="hidden" id="baseOptionId" th:value="${IsbaseOption?.option_id}">
                <select id="productOption" class="form-select">
                    <option value="">선택하세요</option>
                    <th:block th:each="option : ${product.options}">
                        <option
                                th:value="${option.option_id}"
                                th:data-name="${option.option_name}"
                                th:data-price="${option.option_price}"
                                th:data-is-base="${option.base_option}"
                                th:text="${option.option_name + ' (+' + #numbers.formatInteger(option.option_price, 0, 'COMMA') + '원)'}">
                        </option>
                    </th:block>
                </select>
            </div>

            <!-- 선택된 옵션들 표시 영역 -->
            <div id="selectedOptions">
                <!-- 자바스크립트로 동적 추가됨 -->
            </div>

            <!-- 총 주문금액 -->
            <div class="total-price">
                <span>총 주문금액</span>
                <span id="totalPrice">0원</span>
            </div>

            <!-- 장바구니 버튼 -->
            <button type="button" id="addToCart" class="btn-orange" style="background-color: #EF7E06">장바구니 담기</button>
        </div>
    </div>

    <!-- 상품 정보 테이블 -->
    <div class="row product-details">
        <table class="table">
            <tbody>
            <tr th:if="${product.manufacturer}">
                <th>제조사</th>
                <td th:text="${product.manufacturer}"></td>
            </tr>
            <tr th:if="${product.origin}">
                <th>원산지</th>
                <td th:text="${product.origin}"></td>
            </tr>
            <tr th:if="${product.weight}">
                <th>중량/용량</th>
                <td th:text="${product.weight}"></td>
            </tr>
            <tr th:if="${product.expiration_date}">
                <th>유통기한</th>
                <td th:text="${product.expiration_date}"></td>
            </tr>
            <tr th:if="${product.storage_info}">
                <th>보관방법</th>
                <td th:text="${product.storage_info}"></td>
            </tr>
            <!-- 장난감 전용 필드 -->
            <tr th:if="${product.size}">
                <th>크기</th>
                <td th:text="${product.size}"></td>
            </tr>
            <tr th:if="${product.material}">
                <th>재질</th>
                <td th:text="${product.material}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 상품 상세 이미지 -->
    <div class="row product-description">
        <img th:src="${product.image_detail_url}" alt="상품 상세 설명 이미지" class="full-width">
        <div th:utext="${product.description}" class="description-text"></div>
    </div>
</div>

<script src="/js/rim/product_detail.js"></script>
</body>
</html>
