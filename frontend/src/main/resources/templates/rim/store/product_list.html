<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-mypage}">
<head>
    <title>상품 목록</title>
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .manufacturer {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 10px;
            height: 40px;
            overflow: hidden;
        }

        .product-price {
            font-size: 1.1em;
            color: #EF7E06;
            font-weight: bold;
        }

        .category-nav {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .category-nav a {
            margin-right: 20px;
            color: #666;
            text-decoration: none;
            padding: 5px 10px;
        }

        .category-nav a.active {
            color: #EF7E06;
            border-bottom: 2px solid #EF7E06;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }
    </style>
</head>
<body layout:fragment="content">
<div class="container mt-5">
    <!-- 카테고리 네비게이션 -->
    <div class="category-nav">
        <a th:href="@{/products}" th:classappend="${category == null ? 'active' : ''}">전체</a>
        <a th:href="@{/products(category='F')}" th:classappend="${category == 'F' ? 'active' : ''}">사료</a>
        <a th:href="@{/products(category='N')}" th:classappend="${category == 'N' ? 'active' : ''}">간식</a>
        <a th:href="@{/products(category='T')}" th:classappend="${category == 'T' ? 'active' : ''}">장난감</a>
    </div>

    <!-- 상품 그리드 -->
    <div class="product-grid">
        <div th:if="${products.content != null}" th:each="product : ${products.content}" class="product-card">
            <a th:href="@{/products/{id}(id=${product.productId})}">
                <img th:src="${product.imageUrl}" class="product-image" alt="상품 이미지">
                <div class="manufacturer" th:text="${product.manufacturer}">제조사</div>
                <div class="product-name" th:text="${product.name}">상품명</div>
                <div class="product-price">
                    <span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}">0</span>원
                </div>
            </a>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination" th:if="${products.totalPages > 0}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${products.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/products(page=${products.number - 1}, category=${category})}">이전</a>
            </li>
            <li class="page-item"
                th:each="pageNum : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${pageNum == products.number ? 'active' : ''}">
                <a class="page-link"
                   th:href="@{/products(page=${pageNum}, category=${category})}"
                   th:text="${pageNum + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${products.last ? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{/products(page=${products.number + 1}, category=${category})}">다음</a>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
