<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!--TODO : ADMIN layout 작성하기-->
<head>
    <title>관리자 로그인 페이지</title>
<!--    <link rel="stylesheet" th:href="@{/css/admin/login.css}">-->
</head>
<body>
    <div th:fragment="content" class="admin-login-contianer">
        <div class="login-box">
            <p>관리자 로그인</p>
            <form id="adminLoginForm">
                <div class="admin-input-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username">
                </div>
                <div class="admin-input-group">
                    <label for="password">비밀번호</label>
                    <input type="text" id="password" name="password">
                </div>
                <button type="submit" class="admin-login-button">로그인</button>
            </form>
        </div>
    </div>
    <script th:src="@{/js/rim/admin_login.js}"></script>
</body>
</html>
