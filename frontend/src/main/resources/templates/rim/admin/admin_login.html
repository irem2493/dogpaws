<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">


<head>
    <title>관리자 로그인 페이지</title>
    <link th:href="@{/css/common/common.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <!--  JS   -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script th:src="@{/js/common/api.js}"></script>
    <script th:src="@{/js/rim/admin_api.js}"></script>
    <script th:src="@{/js/rim/admin_common.js}"></script>
</head>

<body layout:fragment="content" style="min-height: 100vh">
<div class="container">
    <div class="login-box">
        <div class="logo-container">
            <img src="/img/logo.svg" alt="로고" class="logo-image">
        </div>
        <form id="adminLoginForm">
            <div class="input-container">
                <div class="input-group">
                    <label for="username"><span class="required">*</span> 아이디</label>
                    <input type="text" id="username" name="username" class=" input-a"
                           placeholder="아이디를 입력하세요" style="width: 100%">
                </div>
                <div class="input-group">
                    <label for="password"><span class="required">*</span> 패스워드</label>
                    <input type="password" id="password" name="password" class="input-a"
                           placeholder="패스워드를 입력하세요" style="width: 100%">
                </div>
            </div>
            <button type="submit" class="btn-orange-dark" style="width: 100%">로그인</button>
        </form>
    </div>
</div>

<style>
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 480px;
    padding: 40px;
    border: 1px solid #ddd;
    border-radius: 16px;
    background: white;
}

.logo-container {
    text-align: center;
    margin-bottom: 40px;
}

.logo-image {
    width: 200px;
    height: auto;
}

.input-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 30px;
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.input-group label {
    font-size: 14px;
    color: #333;
    font-weight: 500;
}

.required {
    color: #FF6B00;
    margin-right: 4px;
}
</style>

<script th:src="@{/js/rim/admin_login.js}"></script>
</body>
</html>
