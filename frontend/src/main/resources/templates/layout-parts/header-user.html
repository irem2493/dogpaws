<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<header th:fragment="header" class="header-container">
    <link rel="stylesheet" th:href="@{/css/ajy/header/header_profile.css}" />
<!-- 전체 박스 -->
<div class="header-container-web">
    <!-- 로고 -->
    <div class="header-logo" style="display: flex; justify-content: space-between;">
        <div style="display: flex; gap: 50px; justify-content: center; align-items: center;">
            <div> <a href="/"> <img src="/img/로고.png" alt="로고이미지" /> </a></div>
            <div class="header-search">
                <input type="text" placeholder="검색어를 입력해주세요">
                <i class="bi bi-search"></i>
            </div>
        </div>
        
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
            <!-- 기본 종 모양 -->
            <div id="header-bell-block" style="display: none;">
                <i class="bi bi-bell" style="font-size: 24px;"></i>
            </div>

            <!-- 알림 종 모양 -->
            <div id="header-redbell-block" style="position: relative; display: inline-block; margin-left: 20px;" onclick="bellClick()">
                <i class="bi bi-bell-fill" style="font-size: 24px;"></i>
                <span class="header-redbell"></span>
            </div>










            <!-- 테스트 시작 -->
            <div class="notification-area">
                <button id="notificationBtn" class="notification-btn">
                    <i class="fas fa-bell"></i>
                    <span id="unreadCount" class="badge">0</span>
                </button>

                <div id="notificationList" class="notification-list">
                    <div class="notification-header">
                        <h3>알림</h3>
                        <button id="closeNotification">×</button>
                    </div>
                    <div id="notifications" class="notifications-container">
                        <!-- 알림 내용이 동적으로 추가됨 -->
                    </div>
                </div>
            </div>
            <!-- 테스트 -->
            <style>
                .toast-notification {
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: white;
                    padding: 15px;
                    border-radius: 4px;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                    z-index: 1000;
                    animation: slideIn 0.3s ease-out;
                }

                @keyframes slideIn {
                    from {
                        transform: translateX(100%);
                        opacity: 0;
                    }
                    to {
                        transform: translateX(0);
                        opacity: 1;
                    }
                }
                .notification-area {
                    position: relative;
                    display: inline-block;
                }

                .notification-btn {
                    background: none;
                    border: none;
                    cursor: pointer;
                    position: relative;
                }

                .badge {
                    position: absolute;
                    top: -5px;
                    right: -5px;
                    background: red;
                    color: white;
                    border-radius: 50%;
                    padding: 2px 6px;
                    font-size: 12px;
                }

                .notification-list {
                    position: absolute;
                    top: 100%;
                    right: 0;
                    width: 300px;
                    background: white;
                    border: 1px solid #ddd;
                    border-radius: 4px;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                    z-index: 1000;
                }

                .notification-header {
                    padding: 10px;
                    border-bottom: 1px solid #ddd;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }

                .notifications-container {
                    max-height: 400px;
                    overflow-y: auto;
                }

                .notification-item {
                    padding: 10px;
                    border-bottom: 1px solid #eee;
                    cursor: pointer;
                }

                .notification-item:hover {
                    background: #f5f5f5;
                }

                .hidden {
                    display: none;
                }
            </style>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const notificationBtn = document.getElementById('notificationBtn');
                    const notificationList = document.getElementById('notificationList');
                    const notifications = document.getElementById('notifications');
                    const unreadCount = document.getElementById('unreadCount');
                    const closeBtn = document.getElementById('closeNotification');

                    // FCM 초기화 및 토큰 설정
                    FCMClient.init()

                    // 알림 목록 로드
                    loadNotifications();

                    // 알림 버튼 클릭 이벤트
                    notificationBtn.addEventListener('click', function() {
                        notificationList.classList.toggle('hidden');
                        if (!notificationList.classList.contains('hidden')) {
                            loadNotifications();
                        }
                    });

                    // 닫기 버튼
                    closeBtn.addEventListener('click', function() {
                        notificationList.classList.add('hidden');
                    });

                    // 알림 목록 로드 함수
                    async function loadNotifications() {
                        try {
                            const username = sessionStorage.getItem('username');

                            const notifications = await api.get('/api/notifications/notifications', { username });

                            renderNotifications(notifications);
                            updateUnreadCount(notifications);
                        } catch (error) {
                            console.error('알림 로드 실패:', error);
                        }
                    }

                    // 알림 렌더링 함수
                    function renderNotifications(notifications) {
                        const container = document.getElementById('notifications');
                        container.innerHTML = notifications.map(notification => `
                            <div class="notification-item ${notification.isRead ? 'read' : 'unread'}"
                                 data-id="${notification.alarmId}">
                                <div class="notification-content">
                                    <p>${notification.message}</p>
                                    <small>${formatDate(notification.createdAt)}</small>
                                </div>
                            </div>
                        `).join('');

                        // 알림 클릭 이벤트 추가
                        container.querySelectorAll('.notification-item').forEach(item => {
                            item.addEventListener('click', function() {
                                markAsRead(item.dataset.id);
                            });
                        });
                    }

                    // 날짜 포맷 함수
                    function formatDate(dateString) {
                        const date = new Date(dateString);
                        return date.toLocaleDateString('ko-KR', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    }

                    // 읽음 처리 함수
                    async function markAsRead(alarmId) {
                        try {
                            await fetch(`/api/notifications/mark-read/${alarmId}`, {
                                method: 'POST'
                            });
                            loadNotifications(); // 목록 새로고침
                        } catch (error) {
                            console.error('읽음 처리 실패:', error);
                        }
                    }

                    // 안읽은 알림 수 업데이트
                    function updateUnreadCount(notifications) {
                        const unreadCount = notifications.filter(n => !n.isRead).length;
                        document.getElementById('unreadCount').textContent = unreadCount;
                    }
                });
            </script>
            <!-- 테스트 끝 -->














            <div th:if="${session.user != null and session.dog != null}">
                <img th:src="${session.dog.profileUrl}"
                     width="50px"
                     height="50px"
                     style="border-radius: 50%; width: 50px !important; height: 50px !important;"
                     onerror="this.src='/img/증명사진.jpg';"
                     alt="사용자 프로필 이미지">
            </div>
            <!--<div class="header-username" onclick="toggleDropdown()" style="cursor: pointer;">
                <span>강아지고양이</span><span> 님</span>
            </div>-->

            <div class="profile-dropdown"  style="cursor: pointer;">
                <!-- 로그인 상태 -->
                <span th:if="${session.user != null}" class="profile-dropdown"  style="cursor: pointer;">
                    <span th:text="${session.dog != null and session.dog.dogName != null ? session.dog.dogName + ' 님' :
                                    (session.user != null and session.user.username != null ? session.user.nickname + '님' : 'Guest')}"></span>
                    <img src="/img/icon/button/down-sign.svg" alt="dropdown img" style="width: 12px; height: 12px"/>
                    <!--<button id="logoutButton">로그아웃</button>-->

                    <!-- 드롭다운 모달 -->
                    <div id="profileModal" class="profile-modal">
                        <a class="modal-header" href="/editUserPassword">마이페이지</a>
                        <hr>
                        <div class="modal-content" th:if="${session.dogList != null}">
                            <div th:each="dog : ${session.dogList}" class="dog-profile" onclick="selectDogProfile(this)">
                                <img th:src="${dog['profile_url']}" alt="강아지 프로필 이미지" onerror="this.src='/img/dog_foot2.png';">
                                <span th:text="${dog['dog_name']}"></span>
                                <input type="hidden" th:value="${dog['dog_id']}">
                            </div>
                        </div>
                        <button id="logoutButton">로그아웃</button>
                    </div>
                </span>

                <!-- 비로그인 상태 -->
                <div th:if="${session.user == null}" class="header-auth-links">
                    <a href="/login" style="text-decoration: none; color: black">로그인</a>
                    <span>|</span>
                    <a href="/join" style="text-decoration: none; color: black">회원가입</a>
                </div>
            </div>
        
        </div>
    </div>
    <div class="header-menu">
        <p id="fmatching" onclick="handleClick(event)">친구 매칭</p>
        <p id="pmatching" onclick="handleClick(event)">교배 매칭</p>
        <p id="chat" onclick="handleClick(event)">채팅하기</p>
        <p id="map" onclick="handleClick(event)">근처 강아지 보기</p>
        <p id="store" onclick="handleClick(event)">스토어</p>
        <p id="board" onclick="handleClick(event)">커뮤니티</p>
    </div>

    <!-- 회색 줄 -->
    <div class="header-divider"></div>
</div>
   


<!-- 전체 박스 -->
<div class="header-container-mobile" style="padding: 10px;">
    <!-- 로고 -->
    <div class="header-logo-mobile" style="display: flex; justify-content: space-between; align-items: center;">
        <div> <a href="/"> <img src="/img/로고.png" alt="로고이미지" width="130px" /> </a></div>
        
        <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
        <!-- 기본 종 모양 -->
            <div id="header-bell-block">
                <i class="bi bi-bell" style="font-size: 24px;"></i>
            </div>

            <div >
                <img src="/img/증명사진.jpg"
                    width="50px"
                    height="50px"
                    style="border-radius: 50%; width: 50px !important; height: 50px !important;"
                    onerror="this.src='/img/증명사진.jpg';"
                    alt="사용자 프로필 이미지">
            </div>
            <div class="header-username">
                목록
            </div>
        </div>  
    </div>
  
    <div class="header-search-mobile">
        <input type="text" placeholder="검색어를 입력해주세요">
        <i class="bi bi-search"></i>
    </div>

    <div class="header-menu-mobile" style="display: flex; gap: 13px;">
        <p id="fmatching" onclick="handleClick(event)">친구매칭</p>
        <p id="pmatching" onclick="handleClick(event)">교배매칭</p>
        <p id="chat" onclick="handleClick(event)">채팅</p>
        <p id="map" onclick="handleClick(event)" >지도</p>
        <p id="store" onclick="handleClick(event)">스토어</p>
        <p id="board" onclick="handleClick(event)">커뮤니티</p>
    </div>

    <!-- 회색 줄 -->
    <div class="header-divider-mobile"></div>
</div>

<script src="/js/common/modal.js"></script>
<script src="/js/ajy/token.js"></script>
<script src="/js/ajy/header/header_profile.js"></script>
<script src="/js/ajy/dog_profile_select.js"></script>
<script>
    //TODO 시간관계상 여기서 처리
    function clearStorage() {
        sessionStorage.clear();
        localStorage.clear();
        location.href = '/logout'
    }
</script>
</header>
</html>
