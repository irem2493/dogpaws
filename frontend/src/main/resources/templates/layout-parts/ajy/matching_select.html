<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <link rel="stylesheet" href="/css/ajy/join.css" />
    <link rel="stylesheet" href="/css/ajy/matching_select.css" />
    <title>회원가입</title>
</head>
<body layout:fragment="content" style="min-height: 100vh">
<div class="container">
    <div class="join-container">
        <div class="container_box">
            <div class="header">매칭 선택(친구/ 교배 중 택 1)</div>
            <div class="form-container">
                <div class="sidebar">

                    <div class="progress-container">
                        <div class="step">
                            <div class="circle"></div>
                            <div class="text">회원가입</div>
                        </div>
                        <div class="step">
                            <div class="circle"></div>
                            <div class="text">강아지 프로필 등록(1개 필수 등록)</div>
                        </div>
                        <div class="step">
                            <div class="circle-container">
                                <div class="inner-circle completed"></div>
                            </div>
                            <div class="text">매칭 선택(친구/ 교배 중 택 1)</div>
                        </div>
                        <div class="step">
                            <div class="circle"></div>
                            <div class="text">교배 매칭 시, 선택 서류</div>
                        </div>
                    </div>
                    <div style="margin-top: 200px"></div>
                    <img src="/img/dog.png" alt="강아지 이미지">
                </div>

                <div class="divider" style="height: 900px;"></div>

                <div class="form-fields">
                    <form id="step3Form">
                        <!-- 교배 매칭 체크박스 -->
                        <div class="matching-header">
                            <input type="checkbox" class="checkbox-basic" id="isMatingAvailable" name="isMatingAvailable" value="Y">
                            <label for="isMatingAvailable">교배 매칭</label>
                        </div>

                        <!-- 안내 문구 -->
                        <p class="matching-info">
                            <span class="info-icon">⚠️</span> 선택하지 않아도 다음으로 넘어갈 수 있습니다.<br>
                            교배 매칭 여부는 추후 마이페이지에서 설정할 수 있습니다.
                        </p>

                        <!-- 강아지 이미지 -->
                        <div class="matching-image">
                            <img src="/img/baby_dog.jpg" alt="강아지 세 마리가 바구니 안에 있는 사진">
                        </div>

                        <!-- 설명 -->
                        <p class="matching-description">
                            혈통증명서, 예방접종 증명서, 건강기록 증명서를 기준으로 필터링하여
                            더 신뢰할 수 있는 매칭 결과를 제공합니다.
                            이 정보를 통해 최적의 교배 파트너를 찾을 수 있습니다.
                        </p>
                    </form>

                    <div class="button-container">
                        <button id="preButton">이전</button>
                        <button id="nextButton" onclick="saveStep3()">다음</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/js/ajy/matcing_select.js"></script>
</body>
</html>
