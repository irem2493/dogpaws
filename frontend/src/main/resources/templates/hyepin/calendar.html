<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-mypage}">
<head>
    <title>Title</title>
    <link rel="stylesheet" href="/css/hyepin/calendar.css">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script type="text/javascript"
            src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b174d1824e79a97646f93a55dc6ceab1&libraries=services"></script>
</head>
<body layout:fragment="content" style="min-height: 100vh">
<div class="container">
    <!-- 여기서부터 작성하시면 됩니다. !-->

    <!-- 세션에서 유저값 받기 !-->
    <th:block th:if="${session.user != null && session.dog != null}">
        <input type="hidden" id="sessionUsername" th:value="${session.user.username}">
        <input type="hidden" id="sessionNickname" th:value="${session.user.nickname}">
        <input type="hidden" id="sessionDogId" th:value="${session.dog.dogId}">
    </th:block>

    <!-- 캘린더 -->
    <div style="flex: 2;">
        <!-- FullCalendar -->
        <div id="calendar"></div>
    </div>

    <!-- 일정 추가 폼 모달 -->
    <div class="pawsModal" id="calendarForm" style="display: none;">
        <form id="addCalendarForm">
            <input type="hidden" id="scheduleType" value="">
            <input type="hidden" id="sharedYn" value="">
            <input type="hidden" id="sharedId" value="">
            <button class="pawsModal-close" onclick="closeModal(this)"></button>

            <div id="calendarRegist"><h2 class="pawsModal-title">일정 등록</h2></div>
            <div id="calendarDetail" style="gap: 10px; display: none; justify-content: center;">
                <div><h2 class="pawsModal-title">일정 상세</h2></div>
                <div class="pawsModal-title" style="cursor: pointer;" onclick="calendarModify()"><i
                        class="bi bi-pencil"></i></div>
            </div>
            <input type="hidden" name="calendarId" value="">

            <div class="pawsModal-content">
                <div class="pawsModal-content-container">
                    <div style="display: flex; gap: 30px;">
                        <div>
                            <label for="calendarType">일정 구분</label>
                            <!-- 이거 구분 테이블에서 가져와야함. 일단 픽스로  -->
                            <select class="select-a" id="calendarType" name="calendarType">
                                <option value="W">산책</option>
                                <option value="P">놀이</option>
                                <option value="M">교배</option>
                            </select>
                        </div>

                        <div>
                            <label for="dogId">반려견 선택</label>
                            <select class="select-a" id="dogId" name="dogId">
                                <th:block th:each="dog: ${dogList}">
                                    <option th:value="${dog.dog_id}">[[${dog.dog_name}]]</option>
                                </th:block>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="calendarTitle">제목</label><br>
                        <input class="input-a" type="text" name="calendarTitle" id="calendarTitle" maxlength="7"
                               ><br><br>
                    </div>

                    <div id="shareUserField" style="display: none;">
                        <label for="shareUser">공유자</label><br>
                        <input class="input-a" type="text" id="shareUser" ><br><br>
                    </div>

                    <div>날짜</div>
                    <div style="display: flex; gap: 5px;">
                        <input class="input-a" type="datetime-local" name="calendarStartDate" id="calendarStartDate"
                                style="width: 185px;">
                        <div>~</div>
                        <input class="input-a" type="datetime-local" name="calendarEndDate" id="calendarEndDate"
                                style="width: 185px;">
                    </div>

                    <div>
                        <div>장소</div>

                        <input type="text" id="sample5_address" name="address" class="input-a" placeholder="주소" readonly>
                        <input type="button" onclick="sample5_execDaumPostcode()" class="btn-confirm" value="주소 검색"><br>
                        <div id="calendar-map"></div>

                    </div>

                    <div>
                        <label for="calendarDescription">일정 상세</label><br>
                        <textarea class="input-a" name="calendarDescription" id="calendarDescription"></textarea><br><br>
                    </div>
                </div>
                    <div class="pawsModal-footer">
                        <button class="pawsModal-confirm" id="submit" onclick="calendarSubmit()">저장</button>
                        <button class="pawsModal-cancel" id="delete" onclick="calendarDelete()" style="display: none;">삭제
                        </button>
                        <button class="pawsModal-confirm" id="update" onclick="calendarUpdate()" style="display: none;">수정
                        </button>
                        <button type="button" class="pawsModal-confirm" id="share" onclick="closeAndOpenShareForm(this)">공유</button>
                    </div>

            </div>
        </form>
    </div>

    <!-- 채팅방으로 공유 모달창 -->
    <div class="pawsModal" id="shareForm" style="display: none;">
        <h2 class="pawsModal-title">일정 공유</h2>
        <button class="pawsModal-close" onclick="closeModal(this)"></button>
        <div class="pawsModal-content">
            <div style="display: flex; gap: 20px;">
                <div class="pw-title">일반</div>
                <div class="pw-title">그룹</div>
            </div>
            <div class="chat-list" id="chat-list">
                <div class="one-on-one" id="one-on-one">1:1 채팅목록 </div>  <!-- 1:1 채팅 목록 -->
                <div class="group" id="group">그룹 채팅 목록</div>  <!-- 그룹 채팅 목록 -->
            </div>
        </div>
        <div class="pawsModal-footer">
            <button class="pawsModal-confirm" onclick="calendarShare()">공유하기</button>
        </div>
    </div>  <!-- 채팅방으로 공유 모달창 -->

</div> <!-- 컨테이너 !-->

<script src="/js/hyepin/calendar/calendar.js"></script>
<script type="module"  src="/js/hyepin/calendar/chat.js"></script>
<script>
    var mapContainer = document.getElementById('calendar-map'), // 지도를 표시할 div
        mapOption = {
            center: new daum.maps.LatLng(37.537187, 127.005476), // 지도의 중심좌표
            level: 5 // 지도의 확대 레벨
        };

    //지도를 미리 생성
    var map = new daum.maps.Map(mapContainer, mapOption);
    //주소-좌표 변환 객체를 생성
    var geocoder = new daum.maps.services.Geocoder();
    //마커를 미리 생성
    var marker = new daum.maps.Marker({
        position: new daum.maps.LatLng(37.537187, 127.005476),
        map: map
    });


    function sample5_execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function (data) {
                var addr = data.address; // 최종 주소 변수

                // 주소 정보를 해당 필드에 넣는다.
                document.getElementById("sample5_address").value = addr;
                // 주소로 상세 정보를 검색
                geocoder.addressSearch(data.address, function (results, status) {
                    // 정상적으로 검색이 완료됐으면
                    if (status === daum.maps.services.Status.OK) {

                        var result = results[0]; //첫번째 결과의 값을 활용

                        // 해당 주소에 대한 좌표를 받아서
                        var coords = new daum.maps.LatLng(result.y, result.x);
                        // 지도를 보여준다.
                        mapContainer.style.display = "block";
                        map.relayout();
                        // 지도 중심을 변경한다.
                        map.setCenter(coords);
                        // 마커를 결과값으로 받은 위치로 옮긴다.
                        marker.setPosition(coords)
                    }
                });
            }
        }).open();
    }
</script>
</body>
</html>
